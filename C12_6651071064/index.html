<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chọn “Có” để mở ô nhập thông tin cho hộ chiếu hoặc thẻ tín dụng."><title>Thông tin hộ chiếu và thẻ · Câu 12</title><link rel="stylesheet" href="styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="script.js"></script></head><body><main class="shell"><h1>Thông tin hộ chiếu và thẻ</h1><p class="description">Chọn “Có” để mở ô nhập thông tin cho hộ chiếu hoặc thẻ tín dụng.</p><section class="card"><fieldset><legend>Bạn có hộ chiếu không?</legend><label class="choice"><input type="radio" name="passport" value="yes"> Có</label><label class="choice"><input type="radio" name="passport" value="no" checked> Không</label><label id="passportField" class="revealed" hidden>Số hộ chiếu<input type="text" placeholder="Nhập số hộ chiếu"></label></fieldset><fieldset><legend>Bạn có thẻ tín dụng không?</legend><label class="choice"><input type="radio" name="credit" value="yes"> Có</label><label class="choice"><input type="radio" name="credit" value="no" checked> Không</label><label id="creditField" class="revealed" hidden>Số thẻ tín dụng<input type="text" inputmode="numeric" placeholder="Nhập số thẻ"></label></fieldset></section></main></body></html>
