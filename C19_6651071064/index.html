<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chọn phim, suất chiếu, phòng và nhiều ghế. Hệ thống tính giá từng vé và tổng tiền."><title>Đặt vé xem phim · Câu 19</title><link rel="stylesheet" href="styles.css"><script defer src="script.js"></script></head><body><main class="shell"><h1>Đặt vé xem phim</h1><p class="description">Chọn phim, suất chiếu, phòng và nhiều ghế. Hệ thống tính giá từng vé và tổng tiền.</p><section class="card"><form id="ticketForm"><div class="ticket-grid"><label>Ngày chiếu<input name="date" type="date" required></label><label>Phim<select name="movie" required><option value="">Chọn phim</option><option>Yêu em bất chấp</option><option>Tháng năm rực rỡ</option><option>Và em sẽ đến</option><option>Chuyện ma lúc 3 giờ sáng</option></select></label><label>Suất chiếu<select name="show" required><option value="">Chọn suất chiếu</option><option value="45000">9h–12h · 45.000 đ</option><option value="45000">13h–16h · 45.000 đ</option><option value="55000">17h–20h · 55.000 đ</option><option value="35000">22h–2h · 35.000 đ</option></select></label><label>Phòng chiếu<select name="room" required><option value="">Chọn phòng</option><option value="1">Đồng</option><option value="1.2">Bạc</option><option value="1.5">Vàng</option><option value="2">Kim Cương</option></select></label><label class="seats-label">Chọn chỗ ngồi<select name="seats" multiple size="5" required><option>Ghế 01</option><option>Ghế 02</option><option>Ghế 03</option><option>Ghế 04</option><option>Ghế 05</option><option>Ghế 06</option><option>Ghế 07</option><option>Ghế 08</option><option>Ghế 09</option><option>Ghế 10</option><option>Ghế 11</option><option>Ghế 12</option></select><small>Giữ Ctrl để chọn nhiều ghế.</small></label></div><button class="button" type="submit">Mua vé</button><p id="ticketStatus" class="message" aria-live="polite"></p></form><div id="receiptPreview" hidden></div></section></main></body></html>
