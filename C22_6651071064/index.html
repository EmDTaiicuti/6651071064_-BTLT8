<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nền hồng theo đề. Có thể thêm kỹ năng, đặt mức 0–100 theo bước 10 và xem hồ sơ sau khi đăng ký."><title>Đăng ký thông tin CV · Câu 22</title><link rel="stylesheet" href="styles.css"><script defer src="script.js"></script></head><body><main class="shell"><h1>Đăng ký thông tin CV</h1><p class="description">Nền hồng theo đề. Có thể thêm kỹ năng, đặt mức 0–100 theo bước 10 và xem hồ sơ sau khi đăng ký.</p><section id="cvApp" class="cv-app"><form id="cvForm" class="cv-form"><h2>Đăng ký CV</h2><div class="cv-fields"><label>Họ và tên<input name="name" placeholder="Nguyễn Văn C" required></label><label>Địa chỉ<input name="address" placeholder="TP.HCM" required></label><label>Điện thoại<input name="phone" type="tel" placeholder="0900000000" required></label><label>Email<input name="email" type="email" placeholder="ex@mail.com" required></label><label>Nghề nghiệp<input name="job" placeholder="Designer" required></label><label>Ảnh đại diện<input name="avatar" type="file" accept="image/*"></label></div><fieldset class="skills-editor"><legend>Kỹ năng</legend><div id="skillRows"></div><button type="button" id="addSkill" class="link-button">+ Thêm kỹ năng</button></fieldset><button class="button submit-cv" type="submit">Đăng ký</button></form><article id="profile" class="profile" hidden></article></section></main></body></html>
