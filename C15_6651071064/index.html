<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Chọn một tab để đổi nội dung đang hiển thị."><title>Tabs chuyển nội dung · Câu 15</title><link rel="stylesheet" href="styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="script.js"></script></head><body><main class="shell"><h1>Tabs chuyển nội dung</h1><p class="description">Chọn một tab để đổi nội dung đang hiển thị.</p><section class="card"><div class="tablist" role="tablist"><button class="tab active" role="tab" aria-selected="true" data-tab="overview">Tổng quan</button><button class="tab" role="tab" aria-selected="false" data-tab="details">Chi tiết</button><button class="tab" role="tab" aria-selected="false" data-tab="contact">Liên hệ</button></div><div class="tab-panel" id="overview" role="tabpanel"><h2>Tổng quan</h2><p>Đây là nội dung của tab đầu tiên.</p></div><div class="tab-panel" id="details" role="tabpanel" hidden><h2>Chi tiết</h2><p>Các nội dung khác ẩn đi khi bạn chuyển tab.</p></div><div class="tab-panel" id="contact" role="tabpanel" hidden><h2>Liên hệ</h2><p>Thông tin liên hệ được đặt trong tab thứ ba.</p></div></section></main></body></html>
