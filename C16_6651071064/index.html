<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nhập tên, email, ngày sinh hợp lệ để thêm hàng. Tích chọn rồi xóa một hoặc nhiều hàng."><title>Thêm và xóa hàng dữ liệu · Câu 16</title><link rel="stylesheet" href="styles.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script defer src="script.js"></script></head><body><main class="shell"><h1>Thêm và xóa hàng dữ liệu</h1><p class="description">Nhập tên, email, ngày sinh hợp lệ để thêm hàng. Tích chọn rồi xóa một hoặc nhiều hàng.</p><section class="card"><form id="rowForm" class="row-form"><label>Họ tên<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Ngày sinh<input name="birthdate" type="date" required></label><button class="button" type="submit">Add Row</button></form><div class="row"><button id="deleteRows" class="button danger" type="button">Delete Row</button><span id="tableStatus" class="hint" aria-live="polite">Đã có 2 dòng mẫu.</span></div><div class="table-wrap"><table id="peopleTable"><thead><tr><th>Chọn</th><th>Name</th><th>Email</th><th>Birthdate</th></tr></thead><tbody><tr><td><input type="checkbox" aria-label="Chọn An"></td><td>An</td><td>an@example.com</td><td>2002-05-10</td></tr><tr><td><input type="checkbox" aria-label="Chọn Bình"></td><td>Bình</td><td>binh@example.com</td><td>2001-11-21</td></tr></tbody></table></div></section></main></body></html>
